name: Practice CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Check formatting
        run: |
          gofmt -l . > /tmp/gofmt-files
          cat /tmp/gofmt-files
          test ! -s /tmp/gofmt-files
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Package Linux binaries
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          for arch in amd64 arm64; do
            mkdir -p "build/linux_${arch}" dist
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "build/linux_${arch}/relampo-tickets" .
            tar -C "build/linux_${arch}" -czf "dist/relampo-practice_linux_${arch}.tar.gz" relampo-tickets
          done
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
      - name: Preserve release packages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: practice-linux-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
